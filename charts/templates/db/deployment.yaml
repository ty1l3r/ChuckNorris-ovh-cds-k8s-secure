# ===================================================================
# Template de Déploiement de Base de Données
# ===================================================================
# Description:   Configuration de déploiement PostgreSQL
# Version:       1.0.0
# Responsable:   Équipe DevOps <devops@example.com>
# Mise à jour:   15-10-2023
#
# Ce template définit le déploiement PostgreSQL avec les paramètres
# de sécurité appropriés, limites de ressources et vérifications de santé.
# La base de données utilise un ServiceAccount dédié avec privilèges minimaux
# et suit les bonnes pratiques de sécurité pour les bases de données conteneurisées.
# ===================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.db.fullnameOverride }}
  namespace: {{ .Values.namespace }}
  labels:
    # Labels permettant d'identifier l'application et l'environnement
    app: {{ .Values.db.appLabel }}
    stage: {{ .Values.stage }}
spec:
  # Nombre d'instances à exécuter - généralement une seule pour PostgreSQL (stateful)
  replicas: {{ .Values.db.replicaCount }}
  
  # Sélecteur utilisé par le Deployment pour identifier les pods qu'il gère
  selector:
    matchLabels:
      app: {{ .Values.db.appLabel }}
  
  template:
    metadata:
      # Labels appliqués aux pods - doivent inclure les labels du sélecteur ci-dessus
      labels:
        app: {{ .Values.db.appLabel }}
        stage: {{ .Values.stage }}
    spec:
      # ServiceAccount dédié avec permissions minimales pour la DB
      serviceAccountName: {{ .Values.db.serviceAccountName }}

      # Configuration de sécurité au niveau du pod
      # 999 est l'utilisateur standard pour PostgreSQL
      securityContext:
        runAsUser: 999
        runAsNonRoot: true
        fsGroup: 999

      containers:
        - name: {{ .Values.db.containerName }}
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: IfNotPresent
          
          # Port exposé par le conteneur PostgreSQL (standard: 5432)
          ports:
            - containerPort: {{ .Values.db.containerPort }}

          # Vérification de disponibilité de base (TCP socket)
          # Utilisé par Kubernetes pour déterminer si le pod est en vie
          livenessProbe:
            tcpSocket:
              port: {{ .Values.db.containerPort }}
            initialDelaySeconds: {{ .Values.db.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.db.livenessProbe.failureThreshold }}

          # Vérification si la base est prête à recevoir des connexions
          # Utilisé pour déterminer si le pod doit recevoir du trafic
          readinessProbe:
            tcpSocket:
              port: {{ .Values.db.containerPort }}
            initialDelaySeconds: {{ .Values.db.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.db.readinessProbe.failureThreshold }}

          # Configuration des limites de ressources pour garantir la QoS
          resources:
            limits:
              cpu: {{ .Values.db.resources.limits.cpu }}
              memory: {{ .Values.db.resources.limits.memory }}
            requests:
              cpu: {{ .Values.db.resources.requests.cpu }}
              memory: {{ .Values.db.resources.requests.memory }}

          # Montage du volume persistant pour les données PostgreSQL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data