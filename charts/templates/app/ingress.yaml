# ===================================================================
# Template d'Exposition Réseau de l'Application ChuckNorris
# ===================================================================
# Description:   Configuration de l'accès HTTP externe via Ingress
# Version:       1.0.0
# Mainteneur:    Équipe DevOps
# Dernière modif: 23/05/2025
# ===================================================================

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # ────────────────────────────────────────
  # Identification : Ressource Ingress
  # ────────────────────────────────────────
  # Nom de la ressource Ingress généré à partir du nom du conteneur
  name: {{ .Values.containerName }}-ingress
  # Déploiement dans le namespace approprié (dev/prod)
  namespace: {{ .Values.namespace }}
  # Labels cohérents avec le reste de l'application
  labels:
    app: {{ .Values.appLabel }}
    stage: {{ .Values.stage }}
  # ────────────────────────────────────────
  # Configuration : Contrôleur Ingress
  # ────────────────────────────────────────
  # Annotations spécifiques pour configurer le comportement du contrôleur Ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  # ────────────────────────────────────────
  # Routage : Règles d'accès HTTP
  # ────────────────────────────────────────
  # Règles de routage basées sur le nom d'hôte
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            # Prefix match pour capturer tous les chemins commençant par "/"
            pathType: Prefix
            backend:
              service:
                # Service cible pour le routage du trafic entrant
                name: {{ .Values.containerName }}-svc
                port:
                  number: 80
{{- end }}