# ===================================================================
# Template de Déploiement de l'Application ChuckNorris
# ===================================================================
# Description:   Déploiement sécurisé de l'app web Flask via Helm
# Version:       1.0.0
# Mainteneur:    Équipe DevOps
# Dernière modif: 23/05/2025
# ===================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}                     # Nom du déploiement (chuck-dev ou chuck-prod)
  namespace: {{ .Values.namespace }}                       # Namespace cible (dev / prod)
  labels:
    app: {{ .Values.appLabel }}                            # Label principal
    stage: {{ .Values.stage }}                             # Environnement (dev/prod)
spec:
  replicas: {{ .Values.replicaCount }}                     # Nombre de réplicas (scalabilité)

  selector:
    matchLabels:
      app: {{ .Values.appLabel }}                          # Match strict avec le pod template

  template:
    metadata:
      labels:
        app: {{ .Values.appLabel }}
        stage: {{ .Values.stage }}

    spec:
      # ────────────────────────────────────────
      # Authentification : ServiceAccount
      # ────────────────────────────────────────
      # Utilisation d’un ServiceAccount restreint
      serviceAccountName: {{ .Values.serviceAccountName }}

      # ────────────────────────────────────────
      # Pod Security Context
      # ────────────────────────────────────────
      # Niveau PSS : Appliqué à l'ensemble des conteneurs du pod
      securityContext:
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}         # UID explicite (non-root)
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}   # Interdiction de l'exécution en root
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}             # Groupe pour les volumes montés

      containers:
        - name: {{ .Values.containerName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"  # Image versionnée explicitement
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: {{ .Values.containerPort }}

          # ────────────────────────────────────────
          # Probes : Santé et disponibilité
          # ────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

          # ────────────────────────────────────────
          # Ressources : limites et requêtes
          # ────────────────────────────────────────
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}

          # ────────────────────────────────────────
          # Container Security Context
          # ────────────────────────────────────────
          # Spécifique à CE conteneur uniquement
          securityContext:
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                - {{ .Values.containerSecurityContext.dropCapabilities }}