# ===================================================================
# Template de Service pour l'Application ChuckNorris
# ===================================================================
# Description:   Configuration du point d'accès réseau interne
# Version:       1.0.0
# Mainteneur:    Équipe DevOps
# Dernière modif: 23/05/2025
# ===================================================================

apiVersion: v1
kind: Service
metadata:
  # ────────────────────────────────────────
  # Identification : Métadonnées Service
  # ────────────────────────────────────────
  # Nom du service généré à partir du nom du conteneur
  name: {{ .Values.containerName }}-svc
  # Déployé dans le même namespace que l'application
  namespace: {{ .Values.namespace }}
  # Labels cohérents avec le reste de l'application
  labels:
    app: {{ .Values.appLabel }}
    stage: {{ .Values.stage }}
spec:
  # ────────────────────────────────────────
  # Sélection : Pods cibles
  # ────────────────────────────────────────
  # Sélectionne les pods par leur label app
  selector:
    app: {{ .Values.appLabel }}
  # ────────────────────────────────────────
  # Exposition : Configuration des ports
  # ────────────────────────────────────────
  # Configuration des ports exposés
  ports:
    - protocol: TCP
      port: 80            # Port standard HTTP exposé par le service
      targetPort: {{ .Values.containerPort }}  # Port de l'application dans le conteneur
  # Type ClusterIP: accessible uniquement au sein du cluster
  type: ClusterIP