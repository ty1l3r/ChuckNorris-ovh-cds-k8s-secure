# ===================================================================
# Valeurs pour l'Environnement de Développement ChuckNorris
# ===================================================================
# Description:   Configuration des paramètres de déploiement en dev
# Version:       1.0.0
# Mainteneur:    Équipe DevOps
# Dernière modif: 23/05/2025
# ===================================================================

# Namespace de déploiement (ex: dev, prod)
namespace: dev

# Étiquette d'environnement (affichée comme label)
stage: dev

# Nombre de réplicas
replicaCount: 1

# Nom unique du déploiement (override du nom généré par Helm)
fullnameOverride: chuck-dev

# Labels utilisés dans les métadonnées et les selectors
appLabel: chucknorris
containerName: chucknorris

# Service Account (lié au rôle RBAC spécifique à l'application)
serviceAccountName: chuck-app-sa

# Image Docker utilisée
image:
  repository: t1l3r/chucknorris
  tag: "1.0.0"

# Port HTTP exposé (ex: Flask 5000)
containerPort: 5000

# Contexte de sécurité pour le Pod
podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  fsGroup: 1000

# Contexte de sécurité pour le conteneur
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  dropCapabilities: ALL

# Ressources demandées et limites allouées
resources:
  limits:
    cpu: "250m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Probes de santé : liveness & readiness
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

# Configuration Ingress pour accès HTTP
ingress:
  enabled: true
  host: chuck.dev.local