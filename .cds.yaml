# cds.yaml — Démonstration complète d'un pipeline GitOps sécurisé
# Ce fichier suit la syntaxe CDS (Continuous Delivery Service - OVH) 
# et illustre une chaîne CI/CD incluant les pratiques DevSecOps modernes.

version: v1.0

name: chucknorris-secure-pipeline

pipelines:
  - name: dev-pipeline
    stages:
      # ────────────────────────────────────────
      # Analyse : Scan de code statique
      # ────────────────────────────────────────
      - name: CodeScan
        jobs:
          - job: static-code-analysis
            requirements:
              - binary: bandit
            steps:
              - checkout: git
              - script:
                  - echo "Scanning Python code with Bandit"
                  - bandit -r ./build -f json -o code-scan-results.json
              - publish:
                  path: code-scan-results.json
                  tag: security-reports

      # ────────────────────────────────────────
      # Analyse : Scan de dépendances
      # ────────────────────────────────────────
      - name: DependencyScan
        jobs:
          - job: dependency-check
            requirements:
              - binary: pip-audit
            steps:
              - script:
                  - echo "Scanning dependencies for vulnerabilities"
                  - pip-audit -r ./build/requirements.txt -f json -o deps-scan-results.json
              - publish:
                  path: deps-scan-results.json
                  tag: security-reports

      # ────────────────────────────────────────
      # Build : Construction de l'image Docker
      # ────────────────────────────────────────
      - name: BuildImage
        jobs:
          - job: docker-build
            steps:
              - checkout: git
              - script:
                  - echo "Building Docker image with no-cache option"
                  - docker build --no-cache -t t1l3r/chucknorris:1.0.0 ./build

      # ────────────────────────────────────────
      # Sécurité : Analyse de l'image Docker
      # ────────────────────────────────────────
      - name: ScanImage
        jobs:
          - job: security-scan
            requirements:
              - binary: trivy
            steps:
              - script:
                  - echo "Running enhanced security scan with Trivy"
                  - trivy image --exit-code 1 --severity HIGH,CRITICAL t1l3r/chucknorris:1.0.0
                  - trivy config --exit-code 1 --severity HIGH,CRITICAL ./build/
              - publish:
                  path: trivy-results.json
                  tag: security-reports

      # ────────────────────────────────────────
      # Sécurité : Signature de l'image
      # ────────────────────────────────────────
      - name: SignImage
        jobs:
          - job: secure-signature
            requirements:
              - binary: cosign
            steps:
              - script:
                  - echo "Signing Docker image (keyless mode)"
                  - cosign sign --keyless t1l3r/chucknorris:1.0.0

      # ────────────────────────────────────────
      # Distribution : Publication de l'image
      # ────────────────────────────────────────
      - name: PushImage
        jobs:
          - job: docker-push
            steps:
              - script:
                  - echo "Pushing image to Docker Hub"
                  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                  - docker push t1l3r/chucknorris:1.0.0
                  - docker logout

      # ────────────────────────────────────────
      # Validation : Charts Helm
      # ────────────────────────────────────────
      - name: ValidateHelmCharts
        jobs:
          - job: helm-validation
            requirements:
              - binary: helm
              - binary: kube-score
            steps:
              - script:
                  - echo "Validating Helm charts"
                  - helm lint charts/
                  - helm template chuck charts/ -f charts/dev-values.yaml > manifests.yaml
                  - kube-score score manifests.yaml --output-format json > helm-validation.json
              - publish:
                  path: helm-validation.json
                  tag: security-reports

      # ────────────────────────────────────────
      # Déploiement : Environnement de développement
      # ────────────────────────────────────────
      - name: DeployToDev
        jobs:
          - job: helm-dev-deploy
            requirements:
              - binary: helm
              - binary: kubectl
            steps:
              - script:
                  - echo "Deploying to dev"
                  - export KUBECONFIG=/tmp/secure-kubeconfig
                  - vault read -field=config secret/kubernetes/dev-credentials > $KUBECONFIG
                  - chmod 600 $KUBECONFIG
                  - helm upgrade --install chuck charts/ -f charts/dev-values.yaml --namespace dev
                  - rm -f $KUBECONFIG

      # ────────────────────────────────────────
      # Sécurité : Scan dynamique
      # ────────────────────────────────────────
      - name: SecurityScan
        jobs:
          - job: dynamic-security-scan
            requirements:
              - binary: zap-cli
            steps:
              - script:
                  - echo "Running dynamic security scan"
                  - sleep 30
                  - zap-cli quick-scan --self-contained --start-options "-config api.disablekey=true" https://chuck.dev.local
              - publish:
                  path: zap-report.html
                  tag: security-reports

  # ────────────────────────────────────────
  # Approbation : Validation manuelle
  # ────────────────────────────────────────
  - name: manual-approval
    stages:
      - name: HumanGate
        jobs:
          - job: wait-for-prod
            steps:
              - script:
                  - echo "Manual approval required before production deployment"

  # ────────────────────────────────────────
  # Déploiement : Environnement de production
  # ────────────────────────────────────────
  - name: prod-pipeline
    stages:
      - name: DeployToProd
        jobs:
          - job: helm-prod-deploy
            requirements:
              - binary: helm
              - binary: kubectl
            steps:
              - script:
                  - echo "Deploying to namespace 'prod'"
                  - helm upgrade --install chuck charts/ -f charts/prod-values.yaml --namespace prod

workflows:
  - name: chucknorris-gitops
    when:
      branch:
        - dev
    pipeline: dev-pipeline
    then:
      - manual-approval
      - prod-pipeline

secrets:
  - name: DOCKER_USERNAME
    value: t1l3r
  - name: DOCKER_PASSWORD
    value: ${{cds.secrets.docker_password}}