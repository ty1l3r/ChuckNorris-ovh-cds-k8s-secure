# 📁 ~/cds-ovh/certificats/ovh-dev/role-ovh-dev.yaml
# ──────────────────────────────────────────────────────────────
# 🔧 Role : accès complet CI/CD dans le namespace `dev`
# Utilisé pour le développement, avec gestion des secrets K8s
# ──────────────────────────────────────────────────────────────

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovh-dev-role
  namespace: dev
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete